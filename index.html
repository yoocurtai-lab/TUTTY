<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TUTTY-IA</title>
    <style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: sans-serif;
}

html, body {
    width: 100%;
    height: 100%;
    background-color: #f0f4f8;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.chat-container {
    width: 100%;
    height: 100%;
    background: #f8fafc;
    display: flex;
    flex-direction: column;
    position: relative;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
}

.chat-header {
    width: 100%;
    height: 75px;
    min-height: 75px;
    flex-shrink: 0;
    background-color: #0284c7;
    color: white;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    overflow: hidden;
}

.avatar {
    font-size: 26px;
    flex-shrink: 0;
}

.status-bar {
    width: 100%;
    min-height: 28px;
    flex-shrink: 0;
    text-align: center;
    font-size: 12px;
    padding: 6px;
    background: #009688;
    color: #ffffff;
    font-weight: bold;
    letter-spacing: 0.5px;
    opacity: 0.95;
    overflow: hidden;
}

.chat-messages {
    width: 100%;
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    padding: 18px;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background-color: #f1f5f9;
}

.message {
    padding: 12px 16px;
    border-radius: 18px;
    max-width: 82%;
    min-width: 0;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
    flex-shrink: 0;
}

.user-message {
    background-color: #0284c7;
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
}

.tutor-message {
    background-color: white;
    color: #1e293b;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    border: 1px solid #e2e8f0;
}

.chat-input-area {
    width: 100%;
    min-width: 0;
    flex-shrink: 0;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    background-color: white;
    border-top: 1px solid #e2e8f0;
    position: relative;
}

.input-wrapper {
    flex: 1 1 auto;
    min-width: 0;
    max-width: 100%;
    background-color: #f8fafc;
    border-radius: 24px;
    padding: 2px 16px;
    border: 1px solid #cbd5e1;
    display: flex;
    align-items: center;
    overflow: hidden;
}

input {
    width: 100%;
    min-width: 0;
    border: none;
    padding: 10px 4px;
    font-size: 15px;
    outline: none;
    background: transparent;
}

.btn-action {
    background-color: #0284c7;
    color: white;
    border: none;
    width: 44px;
    height: 44px;
    min-width: 44px;
    min-height: 44px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
}

@media (max-width: 599px) {
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body { display: block; padding: 0; }
    .chat-container { width: 100%; height: 100dvh; max-height: 100dvh; border-radius: 0; box-shadow: none; }
    .message { max-width: 85%; }
    .chat-input-area { padding: 10px; min-height: 64px; }
}

@media (min-width: 600px) and (max-width: 899px) {
    body { padding: 20px; }
    .chat-container { width: 100%; max-width: 800px; height: calc(100vh - 40px); max-height: calc(100vh - 40px); border-radius: 16px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12); }
    .message { max-width: 75%; }
}

@media (min-width: 900px) and (max-width: 1399px) {
    body { padding: 30px; }
    .chat-container { width: 100%; max-width: 950px; height: calc(100vh - 60px); max-height: calc(100vh - 60px); border-radius: 20px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15); }
    .message { max-width: 70%; }
}

@media (min-width: 1400px) {
    body { padding: 40px; }
    .chat-container { width: 100%; max-width: 1100px; height: calc(100vh - 80px); max-height: calc(100vh - 80px); border-radius: 24px; box-shadow: 0 15px 50px rgba(0, 0, 0, 0.18); }
    .message { max-width: 65%; }
}
    </style>
</head>

            </div>

        </div>

        <div class="chat-input-area">
            <div class="input-wrapper">
                <input type="text" id="inputTexto" placeholder="Digite sua dúvida aqui..." autocomplete="off">
            </div>
            <button class="btn-action" id="btnEnviar">➤</button>
        </div>

    <script>

        const HF_TOKEN = "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"; 
        const MODELO_IA = "meta-llama/Meta-Llama-3-8B-Instruct";

        const INSTRUCAO_SISTEMA = `Seu nome é TUTTY, você é o tutor oficial da ESCOLA ROBERTO TONELLOTTI. Você é um tutor de apoio escolar carinhoso, brincalhão, paciente e extremamente acolhedor para todas as disciplinas da educação básica, baseado estritamente no Currículo Paulista da SEDUC-SP. Aqui no Tutty, se precisar tem um assitente de libras digital.Caso o aluno ou usuário pedir, o ensine a fazer um currículo e se precisar oriente como fazer jovem aprendiz. Você também é especialista em Educação Especial Inclusiva, aplicando conceitos da Análise do Comportamento Aplicada (ABA) para adaptar sua comunicação caso o aluno seja autista ou precise de suporte especializado. DIRETRIZES OBRIGATÓRIAS DE INTERAÇÃO:
1. PROIBIDO DAR RESPOSTAS PRONTAS: Nunca, sob nenhuma circunstância, dê o resultado final. Ensine brincando, de forma lúdica and interativa.
2. ABORDAGEM ABA E INCLUSIVA: Use linguagem clara, direta e sem ambiguidades. Divida tarefas complexas em passos muito pequenos e sequenciais. Dê instruções de uma em uma. Se o aluno acertar um pequeno passo, use REFORÇO POSITIVO imediato e entusiasmado (ex: 'Isso mesmo! Você foi incrível! 🌟 Agora vamos para o próximo passo?').
3. TOM DE VOZ: Seja extremamente afetuoso, use emojis acolhedores, valide os sentimentos do aluno com carinho e mantenha um clima de brincadeira saudável e encorajadora.
Responda sempre em português brasileiro, com frases curtas e fáceis de ler, demonstrando imenso orgulho de fazer parte da Escola Roberto Tonellotti.`;

        const chatMessages = document.getElementById('chatMessages');
        const inputTexto = document.getElementById('inputTexto');
        const btnEnviar = document.getElementById('btnEnviar');

        let historicoConversa = [];

        btnEnviar.addEventListener('click', processarMensagemUsuario);
        inputTexto.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') processarMensagemUsuario();
        });

        function adicionarMensagemNaTela(texto, remetente) {
            const caixaMensagem = document.createElement('div');
            caixaMensagem.classList.add('message', remetente === 'user' ? 'user-message' : 'tutor-message');
            caixaMensagem.appendChild(document.createTextNode(texto));
            chatMessages.appendChild(caixaMensagem);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function processarMensagemUsuario() {
            const texto = inputTexto.value.trim();
            if (!texto) return;

            inputTexto.value = '';
            adicionarMensagemNaTela(texto, 'user');

            const bolhaPensando = document.createElement('div');
            bolhaPensando.classList.add('message', 'tutor-message');
            bolhaPensando.innerText = "TUTTY está pensando... 🤔";
            chatMessages.appendChild(bolhaPensando);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                let mensagensHF = [{ role: "system", content: INSTRUCAO_SISTEMA }];
                
                historicoConversa.forEach(msg => {
                    mensagensHF.push({ role: msg.role, content: msg.content });
                });
                
                mensagensHF.push({ role: "user", content: texto });

                const respostaAPI = await fetch(`https://huggingface.co{MODELO_IA}/v1/chat/completions`, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${HF_TOKEN}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        messages: mensagensHF,
                        max_tokens: 500,
                        temperature: 0.7
                    })
                });

                const dados = await respostaAPI.json();
                
                if (chatMessages.contains(bolhaPensando)) {
                    chatMessages.removeChild(bolhaPensando);
                }

                if (dados.choices && dados.choices.length > 0) {
                    const respostaTutor = dados.choices[0].message.content;
                    adicionarMensagemNaTela(respostaTutor, 'tutor');

                    historicoConversa.push({ role: "user", content: texto });
                    historicoConversa.push({ role: "assistant", content: respostaTutor });
